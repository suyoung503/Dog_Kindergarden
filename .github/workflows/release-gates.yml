name: Release gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-cloudflare/package-lock.json

      - name: Install locked dependencies
        working-directory: backend-cloudflare
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: backend-cloudflare
        run: npm audit --audit-level=moderate

      - name: Run backend release gates
        run: scripts/release-audit-smoke.sh --backend-only

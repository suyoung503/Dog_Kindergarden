name = "matgyeomung-api"
main = "src/index.ts"
compatibility_date = "2026-05-20"

[vars]
APP_NAME = "맡겨멍 API"

# 이용일 다음날 리뷰 요청(09:00 UTC) + 가게 상세정보 순환 갱신(4시간마다 8곳)
# 8곳 × 하루 6회 = 48곳/일이므로 서울 큐레이션 전체를 약 1주일에 한 번 확인한다.
[triggers]
crons = ["0 9 * * *", "17 */4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dog_kindergarden_db"
database_id = "02c8c308-32cb-4a5c-b785-a0d6ba01d236"

[ai]
binding = "AI"

name = "matgyeomung-api"
main = "src/index.ts"
compatibility_date = "2026-05-20"

[vars]
APP_NAME = "맡겨멍 API"
NAVER_PLACE_REFRESH_ENABLED = "false"
EXPOSE_UNVERIFIED_STORE_DETAILS = "false"

# 보유기간 정리와 이용일 다음날 리뷰 요청을 매일 09:00 UTC에 실행한다.
# 네이버 상세정보 자동 수집은 출처·권리 검토가 끝날 때까지 트리거에서 제거하고 서버에서도 비활성화한다.
[triggers]
crons = ["0 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dog_kindergarden_db"
database_id = "02c8c308-32cb-4a5c-b785-a0d6ba01d236"

[[r2_buckets]]
binding = "DIARY_PHOTOS"
bucket_name = "matgyeomung-diary-photos"
preview_bucket_name = "matgyeomung-diary-photos-preview"

[ai]
binding = "AI"
